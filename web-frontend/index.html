<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BotLobby</title>
  <script>
    // A React-mount elott szinkron beallitja a mentett temat, hogy ne villanjon fel
    // eloszor a rendszer/alap tema, majd valtson at ra (FOUC elkerulese).
    (function () {
      try {
        var stored = localStorage.getItem('botlobby-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
