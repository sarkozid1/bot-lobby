services:
  postgres:
    image: postgres:16-alpine
    container_name: botlobby-postgres
    environment:
      POSTGRES_DB: botlobby
      POSTGRES_USER: botlobby
      POSTGRES_PASSWORD: botlobby
    ports:
      - "5432:5432"
    volumes:
      - botlobby_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botlobby -d botlobby"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  botlobby_pgdata:
